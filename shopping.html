<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart Testing</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { display: block; margin-top: 10px; }
    input, select { padding: 6px; margin-top: 4px; width: 250px; }
    button { margin-top: 15px; padding: 8px 16px; }
    .output { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Shopping Cart Flow</h1>
  <p>Practice black box testing techniques on this checkout simulation.</p>

  <form id="cartForm">
    <label>
      Quantity (1–10):
      <input type="number" id="quantity" name="quantity" required>
    </label>

    <label>
      Coupon Code:
      <input type="text" id="coupon" name="coupon">
    </label>

    <label>
      Payment Method:
      <select id="payment" name="payment">
        <option value="">--Choose--</option>
        <option value="card">Credit Card</option>
        <option value="paypal">PayPal</option>
        <option value="cod">Cash on Delivery</option>
      </select>
    </label>

    <label>
      Delivery Option:
      <select id="delivery" name="delivery">
        <option value="">--Choose--</option>
        <option value="standard">Standard</option>
        <option value="same">Same Day</option>
      </select>
    </label>

    <button type="submit">Checkout</button>
  </form>

  <div class="output" id="output"></div>

  <script>
    document.getElementById('cartForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const qty = parseInt(document.getElementById('quantity').value, 10);
      const coupon = document.getElementById('coupon').value;
      const payment = document.getElementById('payment').value;
      const delivery = document.getElementById('delivery').value;

      let message = "";

      // Boundary Value
      if (qty < 1 || qty > 10) {
        message += "❌ Quantity out of range.<br>";
      }

      // Equivalence Partitioning
      if (coupon && !coupon.startsWith("SAVE")) {
        message += "❌ Invalid coupon code.<br>";
      }

      // Decision Table
      if (payment === "cod" && delivery === "same") {
        message += "❌ COD not allowed with Same Day delivery.<br>";
      }
      if (payment === "" || delivery === "") {
        message += "❌ Payment or delivery not selected.<br>";
      }

      // Hidden Defect: double discount at qty=10
      let discount = 0;
      if (qty === 10) {
        discount = 20; // BUG: should be 10, applied twice
      }

      if (message === "") {
        message = "✅ Checkout successful!<br>" +
                  "Quantity: " + qty + "<br>" +
                  "Coupon: " + (coupon || "None") + "<br>" +
                  "Payment: " + payment + "<br>" +
                  "Delivery: " + delivery + "<br>" +
                  "Discount Applied: " + discount + "%";
      }

      document.getElementById('output').innerHTML = message;
    });
  </script>
</body>
</html>

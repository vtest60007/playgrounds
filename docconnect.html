<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocConnect Application</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { color: #2c3e50; }
    label { display: block; margin-top: 10px; }
    input, select { padding: 6px; margin-top: 4px; width: 250px; }
    button { margin-top: 15px; padding: 8px 16px; }
    .output { margin-top: 20px; font-weight: bold; color: #2c3e50; }
  </style>
</head>
<body>
  <h1>DocConnect Application</h1>

  <form id="doctorForm">
    <label>City:
      <select id="city" required>
        <option value="">--Choose--</option>
        <option value="Chennai">Chennai</option>
        <option value="Coimbatore">Coimbatore</option>
        <option value="Madurai">Madurai</option>
      </select>
    </label>

    <label>Specialization:
      <select id="specialization" required>
        <option value="">--Choose--</option>
        <option value="No Preference">No Preference</option>
        <option value="Cardiology">Cardiology</option>
        <option value="Orthopedics">Orthopedics</option>
      </select>
    </label>

    <label>First Name:
      <!-- Defect: Numeric values allowed -->
      <input type="text" id="firstName" maxlength="30" required>
    </label>

    <label>Last Name:
      <input type="text" id="lastName" maxlength="30" required>
    </label>

    <label>Locality:
      <input type="text" id="locality" required>
    </label>

    <label>Gender:
      <input type="radio" name="gender" value="Male" required> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Both"> Both
    </label>

    <button type="submit">Search</button>
  </form>

  <button id="listAll">List All Doctors</button>
  <button id="browseCategory">Browse By Category</button>
  <button id="listWomen">List All Women Doctors</button>

  <div class="output" id="output"></div>

  <script>
    // Mock doctor data
    const doctors = [
      { firstName: "Arun", lastName: "Kumar", city: "Chennai", specialization: "Cardiology", locality: "Anna Nagar", gender: "Male" },
      { firstName: "Priya", lastName: "Raman", city: "Chennai", specialization: "Orthopedics", locality: "T Nagar", gender: "Female" },
      { firstName: "Suresh", lastName: "Babu", city: "Coimbatore", specialization: "Cardiology", locality: "RS Puram", gender: "Male" },
      { firstName: "Meena", lastName: "Iyer", city: "Coimbatore", specialization: "Orthopedics", locality: "Peelamedu", gender: "Female" },
      { firstName: "Ravi", lastName: "Shankar", city: "Madurai", specialization: "Cardiology", locality: "KK Nagar", gender: "Male" },
      { firstName: "Lakshmi", lastName: "Narayan", city: "Madurai", specialization: "Orthopedics", locality: "Tallakulam", gender: "Female" },
      { firstName: "Deepa", lastName: "Krishnan", city: "Chennai", specialization: "Cardiology", locality: "Velachery", gender: "Female" },
      { firstName: "Vijay", lastName: "Menon", city: "Coimbatore", specialization: "Orthopedics", locality: "Gandhipuram", gender: "Male" }
    ];

    document.getElementById('doctorForm').addEventListener('submit', function(e){
      e.preventDefault();
      const city = document.getElementById('city').value;
      const specialization = document.getElementById('specialization').value;
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const locality = document.getElementById('locality').value;
      const gender = document.querySelector('input[name="gender"]:checked')?.value;

      let message = "";

      // Defect: First Name validation missing (numeric allowed)
      if(!/^[A-Za-z]+$/.test(lastName)) message += "❌ Last Name must be alphabetic.<br>";
      if(!/^[A-Za-z]+$/.test(locality)) message += "❌ Locality must be alphabetic.<br>";

      if(message==="") {
        // Defect: Cardiology returns wrong specialization
        let resultSpecialization = specialization;
        if(specialization==="Cardiology") resultSpecialization="Orthopedics";

        // Filter mock data (but specialization defect applied)
        let results = doctors.filter(doc => {
          return (!city || doc.city === city) &&
                 (!specialization || specialization === "No Preference" || doc.specialization === resultSpecialization) &&
                 (!firstName || doc.firstName.toLowerCase().includes(firstName.toLowerCase())) &&
                 (!lastName || doc.lastName.toLowerCase().includes(lastName.toLowerCase())) &&
                 (!locality || doc.locality.toLowerCase().includes(locality.toLowerCase())) &&
                 (!gender || gender === "Both" || doc.gender === gender);
        });

        message = results.length > 0 
          ? "✅ Results:<br>" + results.map(d => `${d.firstName} ${d.lastName} (${d.specialization}, ${d.city}, ${d.locality}, ${d.gender})`).join("<br>")
          : "❌ No matching doctors found.";
      }

      document.getElementById('output').innerHTML = message;
    });

    document.getElementById('listAll').addEventListener('click', function(){
      document.getElementById('output').innerHTML = "✅ Listing all doctors:<br>" + 
        doctors.map(d => `${d.firstName} ${d.lastName} (${d.specialization}, ${d.city}, ${d.locality}, ${d.gender})`).join("<br>");
    });

    document.getElementById('browseCategory').addEventListener('click', function(){
      // Defect: No response
      document.getElementById('output').innerHTML = "";
    });

    document.getElementById('listWomen').addEventListener('click', function(){
      let women = doctors.filter(doc => doc.gender === "Female");
      document.getElementById('output').innerHTML = women.length > 0 
        ? "✅ Listing all women doctors:<br>" + women.map(d => `${d.firstName} ${d.lastName} (${d.specialization}, ${d.city}, ${d.locality})`).join("<br>")
        : "❌ No women doctors found.";
    });
  </script>
</body>
</html>
